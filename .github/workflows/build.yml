name: Build & Release InstaTube APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instatube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build InstaTube APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 37 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/platforms/android-37.0" ]]; then
            echo "Android SDK platform 37.0 was not installed correctly" >&2
            exit 1
          fi
          if [[ ! -e "$SDK_ROOT/platforms/android-37" ]]; then
            ln -s "android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
          test -d "$SDK_ROOT/platforms/android-37"
          echo "SDK platform path: $SDK_ROOT/platforms/android-37"

      - name: Clear stale Gradle resource transforms
        shell: bash
        run: |
          set -euo pipefail
          # Transformed AAR resources are reproducible; removing this cache avoids stale/corrupt values.xml outputs.
          rm -rf "$HOME/.gradle/caches/9.7.1/transforms"

      - name: Validate source, resources, and feature wiring
        run: python3 scripts/validate_source.py

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          match = re.search(r'versionName\s*=\s*"([^\"]+)"', text)
          if not match:
              raise SystemExit('versionName is missing from app/build.gradle.kts')
          print(match.group(1))
          PY
          )"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Release tag v$tag_version does not match app versionName $app_version" >&2
            exit 1
          fi

      - name: Configure stable signing for public release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.INSTATUBE_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.INSTATUBE_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.INSTATUBE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.INSTATUBE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" || -z "${RELEASE_KEYSTORE_PASSWORD:-}" || -z "${RELEASE_KEY_ALIAS:-}" || -z "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Persistent release signing secrets are not configured; this APK will use the CI debug key. For reliable in-app updates, configure all four INSTATUBE_RELEASE_* secrets before publishing a production release."
            exit 0
          fi
          key_file="$RUNNER_TEMP/instatube-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "INSTATUBE_RELEASE_STORE_FILE=$key_file" >> "$GITHUB_ENV"
          echo "INSTATUBE_RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "INSTATUBE_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "INSTATUBE_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "Expected APK not found: $APK" >&2
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK" release-assets/InstaTube.apk
          sha256sum release-assets/InstaTube.apk > release-assets/InstaTube.apk.sha256
          ls -lh release-assets/

      - name: Upload InstaTube APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: InstaTube-APK
          path: release-assets/InstaTube.apk*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/InstaTube.apk*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
